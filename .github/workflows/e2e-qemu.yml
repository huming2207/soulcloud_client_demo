name: e2e-qemu

# Full E2E against the soulcloud.js backend in Espressif's ESP32-S3 QEMU:
# connect/auth, commands, stat.fw==buildId, on9log log decode, OTA,
# broker-restart resilience. Runs the pytest-embedded suite in
# tests/e2e/ on a clean runner (scripts/run-e2e.sh remains as a
# bash-only fallback entry point).
#
# The backend is cloned from github.com/huming2207/soulcloud.js (public
# repo; a SOULCLOUDJS_PAT secret is still honoured if it ever goes
# private). The clone MUST include the .flash.rodata tag-extraction fix
# (>= ccc7bce) — the step fails fast otherwise.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The demo must record an already-pushed component commit; a stale
      # gitlink silently makes CI test the old component (GPT ESP-R1).
      - name: Verify components/soulcloud gitlink
        run: |
          git -C components/soulcloud fetch origin master --depth 1
          test "$(git ls-tree HEAD components/soulcloud | awk '{print $3}')" = \
               "$(git -C components/soulcloud rev-parse origin/master)" \
            || { echo "::error::components/soulcloud gitlink points at an unpushed commit; push the submodule first"; exit 1; }

      # Host-compilable protocol tests (no ESP-IDF needed): build + run
      # against the golden soulcloud.js fixtures. Exit code is the
      # assertion (0 = all checks passed).
      - name: Host protocol unit tests
        run: |
          bash components/soulcloud/tests/host/build.sh
          (cd components/soulcloud/tests/host && ./out/protocol_test)

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # Caches the EIM install (IDF source + toolchains + qemu-xtensa) at
      # /tmp/esp and ~/.espressif. EIM is idempotent (idf-im-ui
      # src-tauri/src/lib/idf_tools.rs: tools already installed with the
      # correct version are skipped; git clones skip the fetch when the
      # commit exists), so a cache hit turns the ~3-5 min install step
      # into a few seconds of checks. Key is pinned to the IDF version:
      # a bump starts a fresh install and the old entry expires via the
      # 7-day LRU. v4 only saves on a complete key miss, so passing
      # pushes don't re-upload.
      - name: Cache ESP-IDF install (EIM)
        uses: actions/cache@v4
        with:
          path: |
            /tmp/esp
            ~/.espressif
          key: esp-idf-eim-v6.0.2-${{ runner.os }}

      # Installs ESP-IDF 6.0.2 on the runner (idf.py and the toolchains go
      # on PATH; IDF_PATH points at the installation).
      - uses: espressif/install-esp-idf-action@v1
        with:
          version: v6.0.2

      - name: Install QEMU (Espressif fork)
        run: |
          python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa

      - name: Clone backend
        env:
          SOULCLOUDJS_PAT: ${{ secrets.SOULCLOUDJS_PAT }}
        run: |
          if [ -n "$SOULCLOUDJS_PAT" ]; then
            git clone --depth 1 "https://${SOULCLOUDJS_PAT}@github.com/huming2207/soulcloud.js" "$RUNNER_TEMP/soulcloud.js"
          else
            echo "::warning::no SOULCLOUDJS_PAT secret; trying public clone"
            git clone --depth 1 https://github.com/huming2207/soulcloud.js "$RUNNER_TEMP/soulcloud.js"
          fi
          grep -q 'flash\.rodata' "$RUNNER_TEMP/soulcloud.js/packages/core/src/logging/artifact.ts" \
            || { echo "::error::soulcloud.js is missing the .flash.rodata tag-extraction fix (need >= ccc7bce); push it first"; exit 1; }

      - name: Backend install + postgres + migrate
        run: |
          cd "$RUNNER_TEMP/soulcloud.js"
          bun install
          # compose interpolates ${JWT_SECRET:?} for the api/broker
          # services even when only postgres is started
          export JWT_SECRET="$(openssl rand -base64 48)"
          docker compose up -d --wait postgres
          DATABASE_URL="postgres://soulcloud:soulcloud@127.0.0.1:5432/soulcloud" bun run db:generate
          DATABASE_URL="postgres://soulcloud:soulcloud@127.0.0.1:5432/soulcloud" bun run db:deploy

      - name: Build on9log host decoder
        run: |
          git clone --depth 1 https://github.com/huming2207/on9log_host "$RUNNER_TEMP/on9log_host"
          cd "$RUNNER_TEMP/on9log_host/on9log-cli/web"
          bun install >/dev/null && bun run build >/dev/null
          cd "$RUNNER_TEMP/on9log_host"
          cargo build --release --bin on9log

      - name: Install E2E test deps
        run: |
          python3 -m venv /tmp/e2e-venv
          /tmp/e2e-venv/bin/pip install -q -r tests/e2e/requirements.txt

      - name: Run E2E (pytest-embedded)
        env:
          SOULCLOUD_BACKEND_DIR: ${{ runner.temp }}/soulcloud.js
          DATABASE_URL: "postgres://soulcloud:soulcloud@127.0.0.1:5432/soulcloud"
          ON9LOG_BIN: ${{ runner.temp }}/on9log_host/target/release/on9log
        run: |
          /tmp/e2e-venv/bin/pytest tests/e2e -v

      - name: Upload E2E artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            build/e2e-artifacts/api.log
            build/e2e-artifacts/broker.log
            /tmp/pytest-embedded/**/*.log
          if-no-files-found: ignore
